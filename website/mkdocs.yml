site_name: Copilot Studio Masterclass
site_description: Laboratori pratici per creare agenti con Microsoft Copilot Studio
site_author: Alessandro Lapi
site_url: https://cvn-computergross.github.io/copilot-studio-masterclass/
repo_name: copilot-studio-masterclass
repo_url: https://github.com/cvn-computergross/copilot-studio-masterclass
copyright: Collaboration Value Next · Computer Gross

theme:
  name: material
  language: it
  custom_dir: overrides
  logo: assets/img/edulabs-cvn.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passa al tema scuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passa al tema chiaro
  features:
    - toc.follow
    - navigation.top
    - content.code.copy

extra_javascript:
  - javascripts/vendor/anime.min.js
  - javascripts/animations.js
  - javascripts/checklist.js
  - javascripts/nav-collapsed.js
  - javascripts/header-path.js
  - javascripts/search-modal.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: false }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tasklist: { custom_checkbox: true, clickable_checkbox: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


plugins:
  - search:
      lang: [it, en]

# La navigazione (nav) viene generata da scripts/build_docs.py a partire da docs/ del branch main.
