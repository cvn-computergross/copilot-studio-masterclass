site_name: Copilot Studio Masterclass
site_description: Laboratori pratici per creare agenti con Microsoft Copilot Studio
site_author: Alessandro Lapi
site_url: https://cvn-computergross.github.io/copilot-studio-masterclass/
repo_name: copilot-studio-masterclass
repo_url: https://github.com/cvn-computergross/copilot-studio-masterclass
copyright: Collaboration Value Next · Computer Gross

# Le guide in docs/ sono la sorgente del sito: theme/hooks.py le converte in memoria
# (sintassi GitHub -> MkDocs Material) e costruisce il menu dalla struttura delle cartelle.
docs_dir: docs
hooks:
  - theme/hooks.py

theme:
  name: material
  language: it
  custom_dir: theme
  logo: assets/img/logos/copilot-studio.svg
  favicon: assets/img/logos/copilot-studio.svg
  icon:
    repo: octicons/mark-github-16
    menu: phosphor/list
    top: phosphor/arrow-up
  font:
    text: Inter
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: phosphor/sun
        name: Passa al tema scuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: phosphor/moon
        name: Passa al tema chiaro
  features:
    - toc.follow
    - navigation.top
    - content.code.copy

extra_javascript:
  - assets/javascripts/vendor/anime.min.js
  - assets/javascripts/animations.js
  - assets/javascripts/checklist.js
  - assets/javascripts/nav-collapsed.js
  - assets/javascripts/header-path.js
  - assets/javascripts/search-modal.js

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: false }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tasklist: { custom_checkbox: true, clickable_checkbox: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - !relative $config_dir/theme/.icons

plugins:
  - search:
      lang: [it, en]
