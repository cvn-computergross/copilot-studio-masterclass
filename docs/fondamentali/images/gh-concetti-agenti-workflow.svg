4h0L156,144.69,111.31,100l23.32-23.31a16,16,0,0,1,22.62,0l22.06,22a16,16,0,0,1,0,22.63ZM88.57,35A8,8,0,0,1,103.43,29l8,20A8,8,0,0,1,96.57,55ZM24.57,93A8,8,0,0,1,35,88.57l20,8A8,8,0,0,1,49,111.43l-20-8A8,8,0,0,1,24.57,93ZM231.43,163a8,8,0,0,1-10.4,4.46l-20-8A8,8,0,1,1,207,144.57l20,8A8,8,0,0,1,231.43,163Zm-64,58.06A8,8,0,0,1,152.57,227l-8-20A8,8,0,0,1,159.43,201Z"/></svg><text class="dg-label" x="780" y="361" font-size="13.5" font-weight="600" text-anchor="start">Scrittura su sistema</text><text class="dg-sub" x="780" y="378" font-size="12" font-weight="400" text-anchor="start">azione di scrittura</text><text class="dg-sub" x="780" y="394" font-size="12" font-weight="400" text-anchor="start">(Connettore)</text></g><g class="dg-link f-tools"><path class="dg-arrow" d="M832 304 L832 334" marker-end="url(#gh-concetti-agenti-workflow-head-tools)"/></g><text class="dg-body" x="35" y="443" font-size="12" font-weight="400" text-anchor="start">Il percorso è agile, alcuni processi sono prevedibili.</text><text class="dg-body" x="35" y="468" font-size="12" font-weight="400" text-anchor="start">L'orchestratore chiama passi ben strutturati e ripetibili (flow e codice)</text><text class="dg-body" x="35" y="485" font-size="12" font-weight="400" text-anchor="start">per azioni di natura deterministica.</text><text class="dg-sub" x="35" y="510" font-size="12" font-weight="400" text-anchor="start">Es. intake sanitario: l'esito consultivo nasce da un dialogo multi-turno</text><text class="dg-sub" x="35" y="527" font-size="12" font-weight="400" text-anchor="start">con il paziente.</text><text class="dg-body" x="520" y="443" font-size="12" font-weight="400" text-anchor="start">Il percorso è prevedibile, alcuni processi sono agili.</text><text class="dg-body" x="520" y="468" font-size="12" font-weight="400" text-anchor="start">Inizio e fine del flusso (uno o più) sono noti in anticipo, con capacità</text><text class="dg-body" x="520" y="485" font-size="12" font-weight="400" text-anchor="start">AI incorporate dove un passo richiede ragionamento o giudizio.</text><text class="dg-sub" x="520" y="510" font-size="12" font-weight="400" text-anchor="start">Es. approvazione spese: le nuove voci possono portare a un</text><text class="dg-sub" x="520" y="527" font-size="12" font-weight="400" text-anchor="start">percorso rapido o a un controllo di policy.</text></g></svg>
