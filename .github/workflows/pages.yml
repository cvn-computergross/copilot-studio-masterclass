# Aggiorna il sito GitHub Pages.
#   main        -> guide (docs/) e sorgenti del sito (docs/.vitepress/, package.json)
#   GitHub-Page -> sito compilato (HTML), riscritto a ogni esecuzione: non modificarlo a mano
# GitHub Pages pubblica il branch GitHub-Page (Settings > Pages > Deploy from a branch).
name: Aggiorna sito GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # avvio manuale da Actions > Run workflow

# Permessi minimi per tutto il workflow; il job sotto chiede solo la scrittura sul codice.
permissions:
  contents: read

# Un aggiornamento alla volta.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # serve solo per fare push sul branch GitHub-Page
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installa VitePress
        run: npm ci

      - name: Compila il sito
        run: npm run docs:build

      - name: Pubblica sul branch GitHub-Page
        working-directory: docs/.vitepress/dist
        run: |
          touch .nojekyll # GitHub Pages serve i file così come sono, senza Jekyll
          git init -q -b GitHub-Page
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Aggiornamento sito da main ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" GitHub-Page
